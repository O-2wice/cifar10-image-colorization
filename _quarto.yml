project:
  type: website
  output-dir: docs
  resources:
    - assets/social-card.png
    - assets/favicon.png
  render:
    - index.qmd

website:
  title: "CIFAR-10 Image Colorization"
  description: >-
    Predicting the colours of a grayscale image. A convolutional colorizer and a fully
    connected baseline trained on the same task, loss and data, where the baseline
    carries 21x more parameters and still scores worse.
  # site-url is what lets Quarto emit a sitemap and absolute URLs in the social tags;
  # without it there is no sitemap.xml and og:image cannot resolve.
  site-url: "https://o-2wice.github.io/cifar10-image-colorization/"
  repo-url: "https://github.com/O-2wice/cifar10-image-colorization"
  favicon: assets/favicon.png
  image: assets/social-card.png
  open-graph:
    image-width: 1200
    image-height: 630
    locale: en_GB
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - href: index.qmd
        text: Report
      - text: Notebook
        href: https://github.com/O-2wice/cifar10-image-colorization/blob/main/notebooks/original-image-colorization.ipynb
      - text: Open in Colab
        href: https://colab.research.google.com/github/O-2wice/cifar10-image-colorization/blob/main/notebooks/original-image-colorization.ipynb
    right:
      - icon: github
        href: https://github.com/O-2wice/cifar10-image-colorization
        aria-label: GitHub repository

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    smooth-scroll: true
    df-print: paged
    # Google Search Console ownership; removing it unverifies the property
    include-in-header:
      text: |
        <meta name="google-site-verification" content="jrY_3kfE94UgAOUETVccWoXGGhYpIR16svPJzQmwXFI" />

execute:
  # freeze stores executed results under _freeze/, which is committed. A clone
  # without CIFAR-10, the checkpoints or a GPU can then still render the full
  # page, figures included. Delete _freeze/ or pass --force to re-execute.
  freeze: auto
  cache: false
  warning: false
  message: false
